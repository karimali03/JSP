function computeLab5() {
  const src = state.source;
  const W = state.w, H = state.h;

  /* ── Convert to float [0,1] ── */
  const I = new Float32Array(src.length);
  for (let i = 0; i < src.length; i++) I[i] = src[i] / 255;

  /* ── Pick kernel based on maskType ── */
  const kern = state.lab5.maskType === 4 ? LAPLACIAN_KERNEL : LAPLACIAN_KERNEL_8;
  const centerVal = state.lab5.maskType === 4 ? -4 : -8;
  const kernLabel = state.lab5.maskType === 4
    ? '[ 0  1  0 | 1 -4  1 | 0  1  0 ]'
    : '[ 1  1  1 | 1 -8  1 | 1  1  1 ]';

  /* ── Update kernel grid display ── */
  const kGrid = document.getElementById('l5-kernel-grid');
  if (kGrid) {
    kGrid.innerHTML = '';
    kern.forEach(v => {
      const cls = 'kc' + (v === centerVal ? ' center' : (v === 1 ? ' edge' : ''));
      kGrid.appendChild(el('div', { class: cls }, String(v)));
    });
  }
  const kEq = document.getElementById('l5-kernel-eq');
  if (kEq) kEq.textContent = kernLabel;

  /* ── Part A: Apply Laplacian ── */
  const L = convolve2D(I, W, H, kern, 3);

  /* Sharpened = I - α·∇²I */
  const a = state.lab5.sharpenAlpha;
  const sharp = new Uint8ClampedArray(src.length);
  for (let i = 0; i < src.length; i++) {
    sharp[i] = Math.max(0, Math.min(255, Math.round((I[i] - a * L[i]) * 255)));
  }

  renderToCanvas(document.getElementById('l5-orig'), src, W, H);
  renderFloatToCanvas(document.getElementById('l5-lap'), L, W, H);
  if (state.lab5.showSharpened) {
    renderToCanvas(document.getElementById('l5-sharp'), sharp, W, H);
    document.getElementById('l5-sharp-meta').textContent = 'α=' + a.toFixed(2);
  }

  /* Part A meta */
  let mO = 0, mL = 0;
  for (let i = 0; i < src.length; i++) { mO += I[i]; mL += L[i]; }
  mO /= src.length; mL /= src.length;
  let sO = 0, sL = 0;
  for (let i = 0; i < src.length; i++) { sO += (I[i]-mO)**2; sL += (L[i]-mL)**2; }
  sO = Math.sqrt(sO/src.length); sL = Math.sqrt(sL/src.length);

  document.getElementById('l5-orig-meta').textContent = 'μ=' + (mO*255).toFixed(1) + '  σ=' + (sO*255).toFixed(1);
  document.getElementById('l5-lap-meta').textContent = 'μ=' + mL.toFixed(4) + '  σ=' + sL.toFixed(4);

  const sgA = document.getElementById('l5-stats-a');
  if (sgA) {
    sgA.innerHTML = '';
    sgA.appendChild(statCard('Original μ', (mO*255).toFixed(2)));
    sgA.appendChild(statCard('Original σ', (sO*255).toFixed(2)));
    sgA.appendChild(statCard('Laplacian μ', mL.toFixed(5), { color: 'accent' }));
    sgA.appendChild(statCard('Laplacian σ', sL.toFixed(5), { color: 'accent' }));
    sgA.appendChild(statCard('Mask Center', centerVal, { color: 'amber', full: true }));
  }

  /* ── Part B: Commutativity ── */
  const A = new Array(9).fill(1 / 9);
  const a1 = convolve2D(I, W, H, A, 3);
  const r1 = convolve2D(a1, W, H, kern, 3);  // AVG → LAP
  const l1 = convolve2D(I, W, H, kern, 3);
  const r2 = convolve2D(l1, W, H, A, 3);     // LAP → AVG
  const diffArr = new Float32Array(src.length);
  let mx = 0;
  for (let i = 0; i < diffArr.length; i++) {
    diffArr[i] = Math.abs(r1[i] - r2[i]);
    if (diffArr[i] > mx) mx = diffArr[i];
  }

  renderFloatToCanvas(document.getElementById('l5-m1'), r1, W, H);
  renderFloatToCanvas(document.getElementById('l5-m2'), r2, W, H);
  renderFloatToCanvas(document.getElementById('l5-diff'), diffArr, W, H);

  const maxDiffEl = document.getElementById('l5-maxdiff');
  if (maxDiffEl) maxDiffEl.textContent = mx.toExponential(3);

  /* ── Part C: Edge Counting ── */
  /* abs_laplacian = |L| */
  const absL = new Float32Array(src.length);
  let absMax = 0;
  for (let i = 0; i < src.length; i++) {
    absL[i] = Math.abs(L[i]);
    if (absL[i] > absMax) absMax = absL[i];
  }

  const thresh = state.lab5.edgeThreshold * absMax;
  const binary = new Uint8ClampedArray(src.length);
  let edgePx = 0;
  for (let i = 0; i < src.length; i++) {
    if (absL[i] > thresh) { binary[i] = 255; edgePx++; }
  }

  /* Connected components (8-connectivity) */
  const segments = countConnectedComponents(binary, W, H);

  renderFloatToCanvas(document.getElementById('l5-abs'), absL, W, H);
  renderToCanvas(document.getElementById('l5-bin'), binary, W, H);

  const threshRaw = (thresh * 255).toFixed(3);
  document.getElementById('l5-abs-meta').textContent = 'max=' + absMax.toFixed(4);
  document.getElementById('l5-bin-meta').textContent = 'T=' + threshRaw + '  px=' + edgePx;

  const sgC = document.getElementById('l5-stats-c');
  if (sgC) {
    sgC.innerHTML = '';
    sgC.appendChild(statCard('Edge Pixels', edgePx.toLocaleString(), { color: 'accent', full: true }));
    sgC.appendChild(statCard('Edge Segments', segments.toLocaleString(), { color: 'cyan' }));
    sgC.appendChild(statCard('Threshold T', threshRaw, { color: 'amber' }));
    sgC.appendChild(statCard('Edge %', (100*edgePx/src.length).toFixed(1)+'%', { color: 'emer' }));
  }
}

function computeLab6() {
  const src = state.source;
  const sobelOut = sobelEdges(src, state.w, state.h, state.lab6.sobelT);
  const cannyOut = canny(src, state.w, state.h, state.lab6.sigma, state.lab6.low, state.lab6.high);
  const sob = sobel(src, state.w, state.h);
  renderToCanvas(document.getElementById('l6-orig'), src, state.w, state.h);
  renderToCanvas(document.getElementById('l6-sobel'), sobelOut, state.w, state.h);
  renderToCanvas(document.getElementById('l6-canny'), cannyOut, state.w, state.h);
  renderFloatToCanvas(document.getElementById('l6-gx'), sob.Gx, state.w, state.h);
  renderFloatToCanvas(document.getElementById('l6-gy'), sob.Gy, state.w, state.h);
  renderFloatToCanvas(document.getElementById('l6-gmag'), sob.mag, state.w, state.h);
  let sCount = 0, cCount = 0;
  for (let i = 0; i < sobelOut.length; i++) { if (sobelOut[i] > 128) sCount++; if (cannyOut[i] > 128) cCount++; }
  const sg = document.getElementById('l6-stats');
  sg.innerHTML = '';
  sg.appendChild(statCard('Sobel %', (100 * sCount / sobelOut.length).toFixed(2) + '%', { color: 'amber' }));
  sg.appendChild(statCard('Canny %', (100 * cCount / cannyOut.length).toFixed(2) + '%', { color: 'accent' }));
  let mxG = 0;
  for (let i = 0; i < sob.mag.length; i++) if (sob.mag[i] > mxG) mxG = sob.mag[i];
  sg.appendChild(statCard('|G|max', mxG.toFixed(1), { color: 'cyan', full: true }));
}

function renderLab7() {
  const c = document.getElementById('stage');
  const slide = buildLabFrame(7);

  const stageL = el('div', { class: 'stage-l' });
  const imgs = el('div', { class: 'imgs g4' });

  imgs.appendChild(imgFrame('l7-grad', '|G|', false, 'magnitude'));
  imgs.appendChild(imgFrame('l7-fuz', 'Fuzzy', true, 'soft edges'));
  imgs.appendChild(imgFrame('l7-bin', 'Binary', true, 'T = μ+kσ'));
  stageL.appendChild(imgs);

  // MF charts
  const mfCard = card();
  mfCard.appendChild(cardHdr('Membership Functions · Gaussian'));
  const mfg = el('div', { class: 'mfg' });
  ['DH Input', 'DV Input', 'EDGE Output'].forEach(t => {
    const mfc = el('div', { class: 'mfc' });
    mfc.appendChild(el('div', { class: 'mft' }, t));
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 100 50');
    svg.setAttribute('class', 'mfs');
    const drawGauss = (cx, sigma, color) => {
      let pts = '';
      for (let x = 0; x <= 100; x++) {
        const y = 50 - 45 * Math.exp(-Math.pow((x - cx) / sigma, 2) * 2);
        pts += (x === 0 ? 'M' : 'L') + x + ',' + y + ' ';
      }
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', pts);
      p.setAttribute('stroke', color);
      p.setAttribute('stroke-width', '1.5');
      p.setAttribute('fill', 'none');
      svg.appendChild(p);
    };
    drawGauss(20, 14, '#06b6d4');
    drawGauss(50, 14, '#fbbf24');
    drawGauss(80, 14, '#ec4899');
    mfc.appendChild(svg);
    const lg = el('div', { class: 'mfl' });
    lg.innerHTML = '<span style="color:#06b6d4">LOW</span><span style="color:#fbbf24">MED</span><span style="color:#ec4899">HIGH</span>';
    mfc.appendChild(lg);
    mfg.appendChild(mfc);
  });
  mfCard.appendChild(mfg);
  stageL.appendChild(mfCard);

  // RIGHT
  const stageR = el('div', { class: 'stage-r' });
  const ctrlCard = card();
  ctrlCard.appendChild(cardHdr('Live Control'));
  ctrlCard.appendChild(slider({
    label: 'Threshold T = μ + k·σ',
    min: 0, max: 1.5, step: 0.05, value: state.lab7.threshOff,
    fmt: v => 'k=' + v.toFixed(2),
    onChange: v => { state.lab7.threshOff = v; computeLab7(); }
  }));

  const rulesCard = card();
  rulesCard.appendChild(cardHdr('10 Mamdani Rules'));
  rulesCard.appendChild(el('div', { class: 'eq', style: { fontSize: '10px', textAlign: 'left' }, html:
    '<div>R1 — DH=L, DV=L → <span class="hl">LOW</span></div>' +
    '<div>R2 — DH=M, DV=M → <span class="hl">HIGH</span></div>' +
    '<div>R3-4 — DH=H, DV=M → <span class="hl">HIGH</span></div>' +
    '<div>R5 — DH=M, DV=L → <span class="hl">MED</span></div>' +
    '<div>R7 — DH=L, DV=H → <span class="hl">HIGH</span></div>' +
    '<div>R10 — DH=H, DV=H → <span class="hl">HIGH</span></div>'
  }));
  stageR.appendChild(rulesCard);

  const statsCard = card();
  statsCard.appendChild(cardHdr('Edge Statistics'));
  const grid = el('div', { class: 'stat-grid', id: 'l7-stats' });

function computeLab7() {
  const src = state.source;
  const r = fuzzyEdges(src, state.w, state.h, state.lab7.threshOff);
  // We need to compute |G| separately since fuzzyEdges doesn't return it.
  // Use Prewitt gradients on the normalized image.
  const I = new Float32Array(src.length);
  let s = 0; for (const v of src) s += v;
  const mu0 = s / src.length;
  let sq = 0; for (const v of src) sq += (v - mu0) * (v - mu0);
  const sigma = Math.sqrt(sq / src.length) || 1;
  for (let i = 0; i < src.length; i++) I[i] = (src[i] - mu0) / sigma;
  const PKx = [-1, 0, 1, -1, 0, 1, -1, 0, 1], PKy = [-1, -1, -1, 0, 0, 0, 1, 1, 1];
  const DH = convolve2D(I, state.w, state.h, PKx, 3);
  const DV = convolve2D(I, state.w, state.h, PKy, 3);
  const G = new Float32Array(src.length);
  for (let i = 0; i < src.length; i++) G[i] = Math.sqrt(DH[i] * DH[i] + DV[i] * DV[i]);

  renderToCanvas(document.getElementById('l7-orig'), src, state.w, state.h);
  renderFloatToCanvas(document.getElementById('l7-grad'), G, state.w, state.h);
  renderFloatToCanvas(document.getElementById('l7-fuz'), r.fuzzyImg, state.w, state.h);
  renderToCanvas(document.getElementById('l7-bin'), r.binImg, state.w, state.h);
  let count = 0;
  for (let i = 0; i < r.binImg.length; i++) if (r.binImg[i] > 128) count++;
  const sg = document.getElementById('l7-stats');
  sg.innerHTML = '';
  sg.appendChild(statCard('Edge px', count.toLocaleString(), { color: 'accent' }));
  sg.appendChild(statCard('Edge %', (100 * count / r.binImg.length).toFixed(1) + '%', { color: 'accent' }));
  sg.appendChild(statCard('Threshold T', r.T.toFixed(2), { color: 'amber', full: true }));
}

/* ============================================================
   CODE OVERLAY
   ============================================================ */
function highlight(line) {
  return line
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/(%[^\n]*)$/g, '<span class="tk-cmt">$1</span>')
    .replace(/\b(function|end|if|else|elseif|for|while|return|break|continue|nargin|isempty|true|false)\b/g, '<span class="tk-kw">$1</span>')
    .replace(/\b(imread|imhist|cumsum|round|uint8|double|im2double|im2uint8|size|zeros|ones|min|max|mean|std|mean2|std2|disp|figure|subplot|imshow|title|fprintf|imnoise|filter2|medfilt2|fspecial|imfilter|conv2|svd|dct2|idct2|histeq|abs|reshape|sqrt|atan2|find|mod|histogram|prctile|newfis|addvar|addmf|addrule|evalfis|mat2gray|plotmf|sum|numel|floor|rgb2gray|sprintf|repmat)\b/g, '<span class="tk-fn">$1</span>')
    .replace(/('[^']*')/g, '<span class="tk-str">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g, '<span class="tk-num">$1</span>');
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function goSlide(n) {
  state.slide = Math.max(0, Math.min(TOTAL_SLIDES - 1, n));
  renderCurrent();
  // Update progress
  document.getElementById('progress-fill').style.width = (((state.slide + 1) / TOTAL_SLIDES) * 100) + '%';
  // Update counter
  document.getElementById('s-cur').textContent = String(state.slide + 1).padStart(2, '0');
  document.getElementById('s-tot').textContent = String(TOTAL_SLIDES).padStart(2, '0');
  // Update dots
  document.querySelectorAll('.dot-btn').forEach((d, i) => {
    if (i === state.slide) d.classList.add('active');
    else d.classList.remove('active');
  });
  // Update nav buttons
  document.getElementById('btn-prev').disabled = state.slide === 0;
  document.getElementById('btn-next').disabled = state.slide === TOTAL_SLIDES - 1;
  // Close code overlay on slide change
  closeCode();
}

function renderCurrent() {
  const c = document.getElementById('stage');
  c.innerHTML = '';
  // Re-trigger animation by removing/re-adding
  c.style.animation = 'none';
  c.offsetHeight; // force reflow
  c.style.animation = '';

  if (state.slide === 0) renderIntro();
  else if (state.slide >= 1 && state.slide <= 7) {
    const fn = window['renderLab' + state.slide];
    if (fn) fn();
  }
  else renderOutro();
}

/* ============================================================
   IMAGE LOADER
   ============================================================ */
function decodeGrayB64(b64) {
  const bin = atob(b64);
  const out = new Uint8ClampedArray(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function loadCustomImage(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = IMG_SIZE; canvas.height = IMG_SIZE;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, IMG_SIZE, IMG_SIZE);
      const data = ctx.getImageData(0, 0, IMG_SIZE, IMG_SIZE).data;
      state.source = rgbaToGrayscale(data, IMG_SIZE, IMG_SIZE);
      state.w = IMG_SIZE; state.h = IMG_SIZE;
      renderCurrent();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============================================================
   FATAL ERROR
   ============================================================ */
function showFatalError(msg) {
  document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0512;color:white;font-family:system-ui;flex-direction:column;gap:20px;padding:40px;text-align:center"><div style="font-size:24px;font-weight:700;color:#ec4899">⚠ Failed to load</div><div style="color:#94a3b8;max-width:600px;line-height:1.6">' + msg + '</div><button onclick="location.reload()" style="padding:12px 24px;background:#a855f7;color:white;border:0;border-radius:8px;cursor:pointer;font-weight:600">Reload</button></div>';
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  try {
    // Decode Lena
    state.source = decodeGrayB64(LENA_GRAY_B64);
    state.w = IMG_SIZE; state.h = IMG_SIZE;

    // Build dot navigation
    const dots = document.getElementById('dots');
    for (let i = 0; i < TOTAL_SLIDES; i++) {
      const d = el('button', { class: 'dot-btn' + (i === 0 ? ' active' : ''), onclick: () => goSlide(i) });
      dots.appendChild(d);
    }

    // Bind nav buttons
    document.getElementById('btn-prev').addEventListener('click', () => goSlide(state.slide - 1));
    document.getElementById('btn-next').addEventListener('click', () => goSlide(state.slide + 1));

    // Bind file upload
    document.getElementById('file-input').addEventListener('change', e => {
      const f = e.target.files[0];
      if (f) loadCustomImage(f);
    });

    // Bind code backdrop click to close
    document.getElementById('code-backdrop').addEventListener('click', closeCode);

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') return closeCode();
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goSlide(state.slide + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); goSlide(state.slide - 1); }
      else if (e.key === 'Home') goSlide(0);
      else if (e.key === 'End') goSlide(TOTAL_SLIDES - 1);
    });

    // Hide boot, show app
    setTimeout(() => {
      document.getElementById('boot').classList.add('hide');
      document.getElementById('app').style.display = 'flex';
      goSlide(0);
    }, 600);

  } catch (err) {
    console.error('Fatal init error:', err);
    showFatalError('Failed to initialize: ' + (err.message || err));
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
