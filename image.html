<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Image Processing — CSE 2026</title>
<style>
/* ============================================================
   DIGITAL IMAGE PROCESSING — KEYNOTE EDITION
   ============================================================ */

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-0: #050308;
  --bg-1: #0c0814;
  --bg-2: #160e22;
  --line: rgba(255,255,255,0.06);
  --line-h: rgba(255,255,255,0.12);
  --t0: #ffffff;
  --t1: #f1f5f9;
  --t2: #cbd5e1;
  --t3: #94a3b8;
  --t4: #64748b;
  --t5: #475569;
  --emerald: #10b981;
  --rose: #f43f5e;
  --pink: #ec4899;
  --cyan: #06b6d4;
  --amber: #fbbf24;
  --orange: #fb923c;
  --violet: #a855f7;
  --sky: #38bdf8;
  --c1: #fbbf24;
  --c1b: #f59e0b;
  --c2: #fb7185;
  --c2b: #e11d48;
  --c3: #a855f7;
  --c3b: #7c3aed;
  --c4: #10b981;
  --c4b: #059669;
  --c5: #fb923c;
  --c5b: #ea580c;
  --c6: #06b6d4;
  --c6b: #0891b2;
  --c7: #ec4899;
  --c7b: #be185d;
  --lc:  #ec4899;
  --lcb: #be185d;
  --lcs: rgba(236,72,153,0.12);
  --lcg: rgba(236,72,153,0.4);
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI Variable', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Consolas, monospace;
  --display: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
}

[data-lab="1"] { --lc: var(--c1); --lcb: var(--c1b); --lcs: rgba(251,191,36,.12); --lcg: rgba(251,191,36,.5); }
[data-lab="2"] { --lc: var(--c2); --lcb: var(--c2b); --lcs: rgba(251,113,133,.12); --lcg: rgba(251,113,133,.5); }
[data-lab="3"] { --lc: var(--c3); --lcb: var(--c3b); --lcs: rgba(168,85,247,.12); --lcg: rgba(168,85,247,.5); }
[data-lab="4"] { --lc: var(--c4); --lcb: var(--c4b); --lcs: rgba(16,185,129,.12); --lcg: rgba(16,185,129,.5); }
[data-lab="5"] { --lc: var(--c5); --lcb: var(--c5b); --lcs: rgba(251,146,60,.12); --lcg: rgba(251,146,60,.5); }
[data-lab="6"] { --lc: var(--c6); --lcb: var(--c6b); --lcs: rgba(6,182,212,.12); --lcg: rgba(6,182,212,.5); }
[data-lab="7"] { --lc: var(--c7); --lcb: var(--c7b); --lcs: rgba(236,72,153,.12); --lcg: rgba(236,72,153,.5); }

html, body {
  height: 100%;
  background: var(--bg-0);
  color: var(--t1);
  font-family: var(--font);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  letter-spacing: -0.005em;
}

/* AMBIENT BACKGROUND — animated mesh gradient */
body::before {
  content: '';
  position: fixed; inset: -10%;
  background:
    radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.18), transparent 35%),
    radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.15), transparent 35%),
    radial-gradient(circle at 80% 20%, rgba(56, 189, 248, 0.12), transparent 40%),
    radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.10), transparent 40%);
  pointer-events: none;
  z-index: 0;
  animation: mesh 30s ease-in-out infinite alternate;
  filter: blur(40px);
}
@keyframes mesh {
  0%   { transform: translate(0,0) rotate(0deg); }
  100% { transform: translate(2%, -2%) rotate(8deg); }
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, transparent 30%, var(--bg-0) 100%);
  pointer-events: none;
  z-index: 0;
}

/* === BOOT === */
#boot {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 32px;
  background: var(--bg-0);
  z-index: 100;
}
#boot.hide { opacity: 0; pointer-events: none; transition: opacity .5s; }
.boot-rings { position: relative; width: 88px; height: 88px; }
.boot-ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid transparent;
}
.boot-ring.r1 { border-top-color: var(--violet); animation: spin 1.4s linear infinite; }
.boot-ring.r2 { inset: 12px; border-right-color: var(--pink); animation: spin 1.0s linear infinite reverse; }
.boot-ring.r3 { inset: 24px; border-bottom-color: var(--amber); animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.boot-text { text-align: center; }
.boot-text .b1 {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: .4em; text-transform: uppercase;
  color: var(--t2); margin-bottom: 8px;
}
.boot-text .b2 {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: .3em; text-transform: uppercase;
  color: var(--t5);
}

/* === APP === */
#app { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; }

/* === HEADER === */
header.top {
  flex-shrink: 0;
  padding: 16px 36px 14px;
  display: flex; align-items: center; gap: 20px;
  background: rgba(5, 3, 8, 0.5);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid var(--line);
  position: relative;
}
header.top::after {
  content: ''; position: absolute;
  bottom: -1px; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--lc), transparent);
  opacity: 0.4;
}

.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark {
  width: 38px; height: 38px;
  border-radius: 11px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--violet), var(--pink), var(--amber));
  box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4),
              0 0 0 1px rgba(255,255,255,0.12) inset;
}
.brand-mark::before {
  content: ''; position: absolute; inset: 1.5px;
  border-radius: 9.5px;
  background: linear-gradient(135deg, #0c0814, #160e22);
}
.brand-mark span {
  position: relative; z-index: 1;
  font-weight: 800; font-size: 13px;
  background: linear-gradient(135deg, var(--violet), var(--pink), var(--amber));
  background-clip: text; -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.04em;
}
.brand-text .t1 { font-weight: 700; font-size: 14px; line-height: 1.1; letter-spacing: -0.015em; }
.brand-text .t2 { font-family: var(--mono); font-size: 9px; color: var(--t4); text-transform: uppercase; letter-spacing: .25em; line-height: 1.4; margin-top: 2px; }

.live-pill {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 12px;
  background: rgba(16, 185, 129, 0.08);
  border: 1px solid rgba(16, 185, 129, 0.24);
  border-radius: 99px;
  font-family: var(--mono); font-size: 9px; font-weight: 600;
  color: var(--emerald); text-transform: uppercase; letter-spacing: .18em;
}
.live-pill .d {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--emerald); box-shadow: 0 0 8px var(--emerald);
  animation: pulse 2s infinite;
}
@keyframes pulse { 50% { opacity: .4; } }

.spacer { flex: 1; }

.upload {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--t2);
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: .15em;
  cursor: pointer; transition: all .15s;
}
.upload:hover { color: var(--t0); border-color: var(--violet); background: rgba(168, 85, 247, 0.08); }

.counter {
  display: flex; align-items: baseline; gap: 6px;
  font-family: var(--mono);
}
.counter .l { font-size: 9px; color: var(--t4); text-transform: uppercase; letter-spacing: .2em; }
.counter .c { font-size: 16px; color: var(--t0); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.counter .s { color: var(--t5); margin: 0 1px; }
.counter .t { font-size: 13px; color: var(--t3); font-variant-numeric: tabular-nums; }

.progress {
  flex-shrink: 0;
  height: 2px;
  background: rgba(255,255,255,0.04);
  position: relative;
}
.progress-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--violet), var(--pink), var(--amber));
  box-shadow: 0 0 16px rgba(168, 85, 247, 0.6);
  transition: width .5s cubic-bezier(.4, 0, .2, 1);
  border-radius: 0 99px 99px 0;
}

/* === MAIN === */
main {
  flex: 1; min-height: 0;
  position: relative;
  overflow: hidden;
}
#stage {
  width: 100%; height: 100%;
  overflow-y: auto;
  animation: enter .6s cubic-bezier(.16,1,.3,1) both;
}
@keyframes enter {
  from { opacity: 0; transform: translateY(16px) scale(0.99); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
#stage::-webkit-scrollbar { width: 6px; }
#stage::-webkit-scrollbar-track { background: transparent; }
#stage::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 99px; }

/* === FOOTER === */
footer.bot {
  flex-shrink: 0;
  padding: 12px 36px;
  display: flex; align-items: center; gap: 20px;
  background: rgba(5, 3, 8, 0.5);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid var(--line);
}
.nav-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 16px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--t2);
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .18em;
  cursor: pointer;
  transition: all .15s;
}
.nav-btn:hover:not(:disabled) {
  color: var(--t0);
  border-color: var(--line-h);
  background: rgba(255,255,255,0.06);
  transform: translateY(-1px);
}
.nav-btn:disabled { opacity: .25; cursor: not-allowed; }

.dots {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
}
.dot-btn {
  background: rgba(255,255,255,0.1);
  border: 0; padding: 0;
  width: 6px; height: 6px;
  border-radius: 99px;
  cursor: pointer;
  transition: all .25s cubic-bezier(.16,1,.3,1);
}
.dot-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.5); }
.dot-btn.active {
  width: 36px;
  background: linear-gradient(90deg, var(--violet), var(--pink));
  box-shadow: 0 0 14px rgba(168, 85, 247, 0.6);
}

/* ============================================================
   INTRO SLIDE
   ============================================================ */
.intro {
  height: 100%;
  position: relative; overflow: hidden;
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  align-items: center;
  padding: 0 80px;
  gap: 60px;
}
.intro-orbs { position: absolute; inset: 0; pointer-events: none; }
.orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; }
.orb.o1 { top: -20%; left: -10%; width: 600px; height: 600px; background: radial-gradient(circle, var(--violet), transparent 70%); animation: orb 20s ease-in-out infinite alternate; }
.orb.o2 { bottom: -25%; right: 0%; width: 500px; height: 500px; background: radial-gradient(circle, var(--pink), transparent 70%); animation: orb 24s ease-in-out infinite alternate-reverse; }
.orb.o3 { top: 30%; right: 20%; width: 350px; height: 350px; background: radial-gradient(circle, var(--amber), transparent 70%); animation: orb 18s ease-in-out infinite alternate; }
@keyframes orb {
  0% { transform: translate(0,0) scale(1); }
  100% { transform: translate(60px, 80px) scale(1.15); }
}

.intro-l { position: relative; z-index: 1; animation: rise .9s cubic-bezier(.16,1,.3,1) both; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 7px 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  border-radius: 99px;
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  color: var(--t2);
  text-transform: uppercase; letter-spacing: .28em;
  margin-bottom: 32px;
  backdrop-filter: blur(8px);
}
.eyebrow::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: linear-gradient(135deg, var(--violet), var(--pink));
  box-shadow: 0 0 10px var(--pink);
}

.intro h1 {
  font-family: var(--display);
  font-size: clamp(54px, 8vw, 112px);
  font-weight: 800;
  letter-spacing: -0.045em;
  line-height: 0.92;
  margin-bottom: 32px;
}
.intro h1 .l1 {
  display: block; color: var(--t0);
  background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
  background-clip: text; -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.intro h1 .l2 {
  display: block;
  background: linear-gradient(120deg, var(--violet) 0%, var(--pink) 50%, var(--amber) 100%);
  background-clip: text; -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: 200% 200%;
  animation: shift 8s ease-in-out infinite;
}
@keyframes shift {
  0%, 100% { background-position: 0% 50%; }
  50%      { background-position: 100% 50%; }
}

.intro-tagline {
  font-size: 16px;
  color: var(--t2);
  line-height: 1.65;
  max-width: 480px;
  margin-bottom: 32px;
  font-weight: 400;
}
.intro-tagline strong { color: var(--t0); font-weight: 600; }

.intro-meta {
  display: flex; gap: 36px;
  padding: 24px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  margin-bottom: 32px;
}
.meta-cell .k {
  font-family: var(--mono); font-size: 9px;
  color: var(--t4); text-transform: uppercase; letter-spacing: .25em;
  margin-bottom: 6px;
}
.meta-cell .v {
  font-family: var(--display);
  font-size: 22px; font-weight: 700; color: var(--t0);
  letter-spacing: -0.02em;
}

.cta-row { display: flex; align-items: center; gap: 18px; }
.cta {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 16px 32px;
  background: linear-gradient(135deg, var(--violet) 0%, var(--pink) 50%, var(--amber) 100%);
  border: 0; border-radius: 99px;
  color: white; font-weight: 600; font-size: 15px;
  letter-spacing: -0.005em;
  cursor: pointer;
  position: relative;
  box-shadow: 0 10px 40px rgba(168, 85, 247, 0.4),
              0 0 0 1px rgba(255,255,255,0.1) inset;
  transition: all .25s cubic-bezier(.16,1,.3,1);
  overflow: hidden;
}
.cta::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--pink) 0%, var(--amber) 50%, var(--violet) 100%);
  opacity: 0; transition: opacity .3s;
}
.cta > * { position: relative; z-index: 1; }
.cta:hover { transform: translateY(-2px); box-shadow: 0 16px 50px rgba(236, 72, 153, 0.5), 0 0 0 1px rgba(255,255,255,0.2) inset; }
.cta:hover::before { opacity: 1; }
.cta .arr { font-size: 20px; }

.hint {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 10px;
  color: var(--t4); text-transform: uppercase; letter-spacing: .18em;
}
.kbd {
  display: inline-flex; align-items: center;
  padding: 3px 9px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  font-size: 11px; color: var(--t1);
}

.intro-r {
  position: relative; z-index: 1;
  animation: rise .9s .15s cubic-bezier(.16,1,.3,1) both;
  display: flex; flex-direction: column; gap: 18px;
}

.lena-frame {
  position: relative;
  width: 100%; max-width: 420px; margin-left: auto;
  aspect-ratio: 1;
  border-radius: 24px;
  overflow: hidden;
  box-shadow:
    0 50px 100px -20px rgba(0,0,0,0.8),
    0 0 0 1px rgba(255,255,255,0.1) inset,
    0 0 100px rgba(168, 85, 247, 0.3);
}
.lena-frame canvas {
  width: 100%; height: 100%;
  image-rendering: pixelated; image-rendering: -moz-crisp-edges;
  display: block;
}
.lena-frame::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.6));
  pointer-events: none;
}
.lena-info {
  position: absolute; bottom: 18px; left: 18px; right: 18px;
  display: flex; justify-content: space-between; align-items: flex-end;
  z-index: 2;
}
.lena-info .k { font-family: var(--mono); font-size: 9px; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: .25em; margin-bottom: 4px; }
.lena-info .v { font-family: var(--mono); font-size: 12px; color: white; font-weight: 600; letter-spacing: 0.05em; }

.lab-strip {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 6px; max-width: 420px; margin-left: auto;
}
.strip-pill {
  aspect-ratio: 1;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--line);
  border-radius: 12px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer;
  transition: all .25s cubic-bezier(.16,1,.3,1);
  position: relative; overflow: hidden;
}
.strip-pill::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--lcs), transparent);
  opacity: 0; transition: opacity .25s;
}
.strip-pill:hover {
  border-color: var(--lc);
  transform: translateY(-3px);
  box-shadow: 0 12px 30px var(--lcg);
}
.strip-pill:hover::before { opacity: 1; }
.strip-pill .n { font-family: var(--mono); font-weight: 700; font-size: 14px; color: var(--t1); position: relative; z-index: 1; }
.strip-pill .l { font-family: var(--mono); font-size: 7.5px; color: var(--t4); text-transform: uppercase; letter-spacing: .15em; margin-top: 2px; position: relative; z-index: 1; }

.intro-team {
  font-family: var(--mono); font-size: 10px;
  color: var(--t4);
  max-width: 420px; margin-left: auto;
  text-align: right;
  text-transform: uppercase; letter-spacing: .18em;
  line-height: 1.7;
}
.intro-team .lbl { color: var(--t5); display: block; margin-bottom: 4px; font-size: 9px; }
.intro-team span { color: var(--t2); }
.intro-team .sep { color: var(--t5); margin: 0 6px; }

@keyframes rise {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   LAB SLIDE — KEYNOTE STYLE
   ============================================================ */
.lab {
  height: 100%; min-height: 100%;
  position: relative;
  padding: 28px 48px 24px;
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 18px;
  overflow: hidden;
}

/* Massive background lab number */
.lab::before {
  content: attr(data-num);
  position: absolute;
  top: 50%; right: -60px;
  transform: translateY(-50%);
  font-family: var(--display);
  font-weight: 900;
  font-size: 540px;
  line-height: 0.8;
  letter-spacing: -0.06em;
  color: var(--lc);
  opacity: 0.04;
  pointer-events: none;
  z-index: 0;
}

/* === HERO HEADER === */
.lab-head {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 28px;
}
.lab-num-big {
  font-family: var(--display);
  font-weight: 900;
  font-size: 88px;
  line-height: 1;
  letter-spacing: -0.05em;
  background: linear-gradient(135deg, var(--lc) 0%, var(--lcb) 100%);
  background-clip: text; -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 30px var(--lcg));
}
.lab-tx { display: flex; flex-direction: column; gap: 6px; }
.lab-eb {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  color: var(--lc); text-transform: uppercase; letter-spacing: .3em;
  width: fit-content;
}
.lab-eb::before {
  content: ''; width: 16px; height: 1px; background: var(--lc);
  box-shadow: 0 0 6px var(--lc);
}
.lab-h1 {
  font-family: var(--display);
  font-size: 36px; font-weight: 700;
  letter-spacing: -0.03em; line-height: 1.05;
  color: var(--t0);
}
.lab-h1 em {
  font-style: normal;
  font-weight: 400;
  color: var(--t4);
}
.lab-sub {
  font-size: 13.5px;
  color: var(--t2);
  max-width: 720px;
  line-height: 1.55;
  margin-top: 4px;
}
.lab-sub code {
  font-family: var(--mono); font-size: 12px;
  color: var(--lc);
  background: var(--lcs);
  padding: 2px 7px; border-radius: 5px;
}

.lab-actions { display: flex; align-items: center; gap: 10px; }

/* "View Code" button - opens code overlay */
.code-trigger {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 10px 18px;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--line);
  border-radius: 11px;
  color: var(--t1);
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .15em;
  cursor: pointer;
  transition: all .2s;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.code-trigger:hover {
  border-color: var(--lc);
  background: var(--lcs);
  color: var(--lc);
  transform: translateY(-1px);
  box-shadow: 0 8px 24px var(--lcg);
}
.code-trigger .ic {
  width: 14px; height: 14px;
  border-radius: 3px;
  background: linear-gradient(135deg, var(--lc), var(--lcb));
  position: relative;
}
.code-trigger .ic::before {
  content: '<>';
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 7px; font-weight: 900; color: var(--bg-0);
}

.lab-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px;
  border: 1px solid var(--lc);
  background: var(--lcs);
  border-radius: 99px;
  font-family: var(--mono); font-size: 9px; font-weight: 600;
  color: var(--lc); text-transform: uppercase; letter-spacing: .2em;
}
.lab-badge.ok { color: var(--emerald); border-color: rgba(16,185,129,.4); background: rgba(16,185,129,.08); }
.lab-badge.warn { color: var(--amber); border-color: rgba(251,191,36,.4); background: rgba(251,191,36,.08); }

/* === LAB BODY === */
.lab-body {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 22px;
  min-height: 0;
}
@media (max-width: 1280px) {
  .lab-body { grid-template-columns: 1.3fr 1fr; gap: 18px; }
  .lab-num-big { font-size: 72px; }
  .lab-h1 { font-size: 28px; }
}
@media (max-width: 1024px) {
  .lab-body { grid-template-columns: 1fr; }
}

/* === STAGE (left side - main visual) === */
.stage-l {
  display: flex; flex-direction: column;
  gap: 14px;
  min-height: 0;
  overflow: auto;
  padding-right: 4px;
}
.stage-l::-webkit-scrollbar { width: 4px; }
.stage-l::-webkit-scrollbar-track { background: transparent; }
.stage-l::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 99px; }

/* === SIDE (right - controls + stats) === */
.stage-r {
  display: flex; flex-direction: column;
  gap: 14px;
  min-height: 0; overflow: auto;
  padding-right: 4px;
}
.stage-r::-webkit-scrollbar { width: 4px; }
.stage-r::-webkit-scrollbar-track { background: transparent; }
.stage-r::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 99px; }

/* === GLASS CARD === */
.card {
  background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.015) 100%);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  position: relative;
  display: flex; flex-direction: column; gap: 14px;
  transition: border-color .25s;
  flex-shrink: 0;
}
.card:hover { border-color: var(--line-h); }
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--lcg), transparent);
  opacity: 0.6;
}

.card-hdr {
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.card-hdr-line {
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  color: var(--t3); text-transform: uppercase; letter-spacing: .25em;
  flex: 1;
  display: flex; align-items: center; gap: 10px;
}
.card-hdr-line::before {
  content: ''; width: 18px; height: 1px;
  background: var(--lc);
  box-shadow: 0 0 6px var(--lc);
}
.card-hdr-line::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--line-h), transparent);
}

/* === CONTROL: SLIDER === */
.ctrl { display: flex; flex-direction: column; gap: 10px; }
.ctrl-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
}
.ctrl-l { font-family: var(--mono); font-size: 10px; font-weight: 500; color: var(--t3); text-transform: uppercase; letter-spacing: .12em; }
.ctrl-v {
  font-family: var(--mono); font-size: 12px; font-weight: 700;
  color: var(--lc);
  background: var(--lcs);
  border: 1px solid var(--lc);
  padding: 2px 11px; border-radius: 7px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}

.slider {
  position: relative;
  height: 6px;
  background: rgba(255,255,255,0.06);
  border-radius: 99px;
}
.slider-fill {
  position: absolute; left: 0; top: 0; height: 100%;
  background: linear-gradient(90deg, var(--lc), var(--lcb));
  border-radius: 99px;
  box-shadow: 0 0 14px var(--lcg);
  transition: width .12s ease-out;
}
.slider-thumb {
  position: absolute; top: 50%;
  width: 18px; height: 18px;
  background: white;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 4px 14px var(--lcg), 0 0 0 5px var(--lcs);
  pointer-events: none;
  transition: left .12s ease-out, transform .15s;
  border: 2px solid var(--lc);
}
.ctrl:hover .slider-thumb { transform: translate(-50%, -50%) scale(1.12); }
.slider input {
  position: absolute; inset: -10px 0;
  width: 100%; height: calc(100% + 20px);
  opacity: 0; cursor: pointer; z-index: 2;
}

/* === TOGGLE === */
.tg {
  display: flex; gap: 4px;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--line);
  border-radius: 11px; padding: 4px;
}
.tg-btn {
  flex: 1;
  padding: 8px 12px;
  background: transparent; border: 0; border-radius: 7px;
  color: var(--t3);
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em;
  cursor: pointer;
  transition: all .15s;
}
.tg-btn:hover { color: var(--t1); background: rgba(255,255,255,0.04); }
.tg-btn.active {
  color: white;
  background: linear-gradient(135deg, var(--lc), var(--lcb));
  box-shadow: 0 4px 14px var(--lcg);
}

/* === STAT GRID — beautiful cards instead of rows === */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.stat-card {
  padding: 11px 13px;
  background: rgba(255,255,255,0.025);
  border: 1px solid var(--line);
  border-radius: 11px;
  display: flex; flex-direction: column; gap: 3px;
  transition: all .15s;
}
.stat-card:hover { background: rgba(255,255,255,0.04); border-color: var(--line-h); transform: translateY(-1px); }
.stat-card.full { grid-column: 1 / -1; }
.stat-card .k {
  font-family: var(--mono); font-size: 8.5px;
  color: var(--t4); text-transform: uppercase; letter-spacing: .18em; font-weight: 600;
}
.stat-card .v {
  font-family: var(--mono); font-size: 18px; font-weight: 800;
  color: var(--t0); font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em; line-height: 1;
}
.stat-card.accent { background: var(--lcs); border-color: rgba(255,255,255,0.08); }
.stat-card.accent .v { color: var(--lc); }
.stat-card.cyan .v { color: var(--cyan); }
.stat-card.amber .v { color: var(--amber); }
.stat-card.emer .v { color: var(--emerald); }
.stat-card.rose .v { color: var(--rose); }

/* === HERO HIGHLIGHT BOX === */
.hero-stat {
  position: relative;
  padding: 16px 18px;
  background: linear-gradient(135deg, var(--lcs), transparent);
  border: 1px solid var(--lc);
  border-radius: 14px;
  overflow: hidden;
}
.hero-stat::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--lc), transparent);
}
.hero-stat-k {
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  color: var(--lc); text-transform: uppercase; letter-spacing: .25em;
  margin-bottom: 8px;
}
.hero-stat-v {
  font-family: var(--display); font-size: 32px; font-weight: 800;
  color: var(--lc); font-variant-numeric: tabular-nums;
  line-height: 1;
  letter-spacing: -0.03em;
}
.hero-stat-n { font-size: 11px; color: var(--t3); margin-top: 6px; }

/* === IMAGE DISPLAY === */
.imgs { display: grid; gap: 12px; }
.imgs.g2 { grid-template-columns: repeat(2, 1fr); }
.imgs.g3 { grid-template-columns: repeat(3, 1fr); }
.imgs.g4 { grid-template-columns: repeat(4, 1fr); }

.img-frame {
  position: relative;
  aspect-ratio: 1;
  background: black;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  transition: all .3s cubic-bezier(.16,1,.3,1);
}
.img-frame.hot {
  border-color: var(--lc);
  box-shadow:
    0 0 0 2px var(--lcs),
    0 12px 40px rgba(0,0,0,0.5),
    0 0 40px var(--lcg);
}
.img-frame:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 0 1px var(--lc), 0 16px 50px rgba(0,0,0,0.6), 0 0 50px var(--lcg);
}
.img-frame canvas {
  width: 100%; height: 100%;
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  display: block;
}
.img-pill {
  position: absolute; top: 10px; left: 10px;
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  color: white;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: 5px 10px; border-radius: 99px;
  text-transform: uppercase; letter-spacing: .15em;
}
.img-pill .d { width: 5px; height: 5px; border-radius: 50%; background: var(--t3); }
.img-frame.hot .img-pill .d { background: var(--lc); box-shadow: 0 0 8px var(--lc); animation: pulse 2s infinite; }

.img-cap {
  position: absolute; bottom: 8px; left: 10px; right: 10px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 9px;
  color: rgba(255,255,255,0.85);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
  padding: 4px 10px; border-radius: 99px;
  pointer-events: none;
}

/* === HISTOGRAM === */
.hist-card { padding: 14px; }
.hist-row { display: grid; gap: 10px; }
.hist-row.g2 { grid-template-columns: 1fr 1fr; }
.hist-row.g3 { grid-template-columns: 1fr 1fr 1fr; }
.hist {
  position: relative;
  height: 72px;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 4px;
  overflow: hidden;
}
.hist canvas { width: 100%; height: 100%; display: block; }
.hist-lbl {
  position: absolute; top: 6px; left: 8px;
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  color: var(--t3); text-transform: uppercase; letter-spacing: .12em;
  z-index: 1;
}

/* === BULLETS === */
.bullets { display: flex; flex-direction: column; gap: 9px; }
.bullet {
  display: flex; gap: 11px;
  font-size: 12px; line-height: 1.55;
  color: var(--t2);
}
.bullet::before {
  content: ''; flex-shrink: 0;
  margin-top: 8px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--lc); box-shadow: 0 0 6px var(--lcg);
}
.bullet strong { color: var(--t0); font-weight: 600; }

/* === EQ BOX === */
.eq {
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 11px 14px;
  font-family: var(--mono); font-size: 11.5px;
  color: var(--t1); line-height: 1.7;
  text-align: center;
}
.eq .hl { color: var(--lc); font-weight: 700; }

/* === KERNEL GRID === */
.kernel {
  display: grid;
  grid-template-columns: repeat(3, 1fr); gap: 6px;
  max-width: 180px; margin: 4px auto;
}
.kc {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 18px; font-weight: 800;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.02);
  color: var(--t4);
  border-radius: 10px;
  transition: all .2s;
}
.kc.center {
  border-color: var(--lc);
  background: linear-gradient(135deg, var(--lcs), transparent);
  color: var(--lc);
  box-shadow: 0 0 24px var(--lcg);
  transform: scale(1.08);
}
.kc.edge {
  border-color: rgba(6, 182, 212, 0.3);
  background: rgba(6, 182, 212, 0.06);
  color: var(--cyan);
}

/* === PIPELINE === */
.pipe {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;
}
.pipe-step { text-align: center; position: relative; }
.pipe-step:not(:last-child)::after {
  content: ''; position: absolute;
  top: 25px; right: -8px;
  width: 16px; height: 1px;
  background: linear-gradient(90deg, var(--line-h), transparent);
}
.pipe-box {
  width: 100%; aspect-ratio: 1; max-width: 50px; margin: 0 auto;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.025);
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10px; font-weight: 800;
  color: var(--t3);
  transition: all .25s;
}
.pipe-step:hover .pipe-box,
.pipe-step.hot .pipe-box {
  border-color: var(--lc);
  background: linear-gradient(135deg, var(--lcs), transparent);
  color: var(--lc);
  box-shadow: 0 0 18px var(--lcg);
}
.pipe-lbl {
  font-family: var(--mono); font-size: 8px;
  color: var(--t5); text-transform: uppercase; letter-spacing: .12em;
  margin-top: 6px;
}

/* === PARTITION === */
.part {
  position: relative;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--line);
  border-radius: 11px;
  height: 86px; padding: 6px;
}
.part canvas { width: 100%; height: 100%; display: block; }
.part-mark {
  position: absolute; top: 0; bottom: 0;
  width: 2px; background: var(--amber);
  box-shadow: 0 0 16px rgba(251,191,36,.8);
  pointer-events: none;
}
.part-mark .lbl {
  position: absolute; top: -4px;
  transform: translateX(-50%);
  background: var(--bg-0); padding: 2px 8px;
  font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--amber);
  border-radius: 5px;
  border: 1px solid rgba(251,191,36,.3);
}
.legend {
  display: flex; align-items: center; justify-content: center;
  gap: 24px;
  font-family: var(--mono); font-size: 10px;
  color: var(--t2);
  padding-top: 4px;
}
.legend .sw {
  width: 12px; height: 12px; border-radius: 4px;
  display: inline-block; margin-right: 8px; vertical-align: middle;
  box-shadow: 0 0 8px currentColor;
}

/* === MF CHARTS (Lab 7) === */
.mfg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mfc {
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 10px;
}
.mft {
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  color: var(--t4); text-transform: uppercase; letter-spacing: .15em;
  margin-bottom: 6px;
}
.mfs { width: 100%; height: 54px; display: block; }
.mfl {
  display: flex; justify-content: space-around;
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  margin-top: 4px;
}

/* === Q&A (Lab 4) === */
.qa-list { display: flex; flex-direction: column; gap: 12px; }
.qa-item {
  position: relative;
  background: linear-gradient(135deg, var(--lcs), transparent);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
}
.qa-q { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.qa-tag {
  flex-shrink: 0;
  padding: 4px 9px;
  background: linear-gradient(135deg, var(--lc), var(--lcb));
  border-radius: 7px;
  display: flex; align-items: center;
  font-family: var(--mono); font-size: 9px; font-weight: 800;
  color: white;
  letter-spacing: .1em;
}
.qa-q-tx { font-size: 13px; font-weight: 600; color: var(--t0); padding-top: 3px; line-height: 1.4; }
.qa-a {
  margin-left: 38px;
  padding: 10px 14px;
  background: rgba(0,0,0,0.4);
  border-radius: 9px;
  font-size: 12px; line-height: 1.6;
  color: var(--t2);
  border-left: 2px solid var(--lc);
}

/* ============================================================
   CODE OVERLAY (slides in from right)
   ============================================================ */
.code-overlay {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 0;
  background: rgba(5, 3, 8, 0.85);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-left: 1px solid var(--line);
  z-index: 50;
  transition: width .35s cubic-bezier(.16,1,.3,1);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.code-overlay.open { width: min(640px, 60vw); }
.code-overlay-hdr {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 14px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(0,0,0,0.4);
}
.code-overlay-hdr .traffic { display: flex; gap: 7px; }
.code-overlay-hdr .traffic span { width: 11px; height: 11px; border-radius: 50%; }
.code-overlay-hdr .traffic span:nth-child(1) { background: #ff5f57; }
.code-overlay-hdr .traffic span:nth-child(2) { background: #febc2e; }
.code-overlay-hdr .traffic span:nth-child(3) { background: #28c840; }
.code-overlay-hdr .filename {
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  color: var(--t1);
  letter-spacing: -0.01em;
}
.code-overlay-hdr .lang {
  margin-left: auto;
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  color: var(--t4); text-transform: uppercase; letter-spacing: .25em;
  padding: 4px 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  border-radius: 99px;
}
.code-close {
  background: transparent; border: 0;
  padding: 4px 8px;
  color: var(--t3);
  font-family: var(--mono); font-size: 11px;
  cursor: pointer; border-radius: 6px;
  transition: all .15s;
}
.code-close:hover { color: var(--t0); background: rgba(255,255,255,0.05); }

.code-tabs {
  flex-shrink: 0;
  display: flex; gap: 4px;
  padding: 0 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(0,0,0,0.3);
}
.code-tab {
  background: transparent; border: 0;
  padding: 12px 18px;
  color: var(--t4);
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .15em;
  cursor: pointer;
  transition: all .15s;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.code-tab:hover { color: var(--t1); }
.code-tab.active {
  color: var(--lc);
  border-bottom-color: var(--lc);
}

.code-body {
  flex: 1; min-height: 0;
  overflow: auto;
  background: #08060f;
  font-family: var(--mono); font-size: 12.5px;
  line-height: 1.7;
}
.code-body::-webkit-scrollbar { width: 8px; height: 8px; }
.code-body::-webkit-scrollbar-track { background: transparent; }
.code-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }
.code-body pre { padding: 16px 0; white-space: pre; color: var(--t1); }
.code-body .ln-row { display: flex; padding: 0 16px; }
.code-body .ln-row:hover { background: rgba(255,255,255,0.025); }
.code-body .ln {
  display: inline-block; width: 36px;
  color: var(--t5); text-align: right; padding-right: 14px;
  user-select: none; flex-shrink: 0; font-size: 11px;
  border-right: 1px solid rgba(255,255,255,0.04);
  margin-right: 14px;
}
.code-body .src { flex: 1; min-width: 0; }
.tk-cmt { color: #6a737d; font-style: italic; }
.tk-kw  { color: #ff7b72; font-weight: 500; }
.tk-fn  { color: #79c0ff; }
.tk-str { color: #a5d6ff; }
.tk-num { color: #f2cc60; }

.code-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 49;
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
.code-backdrop.open { opacity: 1; pointer-events: auto; }

/* ============================================================
   OUTRO
   ============================================================ */
.outro {
  height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 40px;
  position: relative;
}
.outro-pre {
  font-family: var(--mono); font-size: 11px;
  color: var(--t3);
  text-transform: uppercase; letter-spacing: .45em;
  margin-bottom: 24px;
  animation: rise .6s both;
}
.outro h1 {
  font-family: var(--display);
  font-size: clamp(64px, 8vw, 96px);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
  margin-bottom: 20px;
  animation: rise .7s .1s both;
  background: linear-gradient(135deg, var(--violet), var(--pink), var(--amber));
  background-clip: text; -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.outro-sub {
  font-size: 16px; color: var(--t2);
  max-width: 580px; line-height: 1.6;
  margin-bottom: 40px;
  animation: rise .7s .2s both;
}
.outro-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 10px; max-width: 720px;
  margin: 0 auto 40px;
  animation: rise .7s .3s both;
}
.outro-cell {
  aspect-ratio: 1;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--line);
  border-radius: 14px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  cursor: pointer;
  transition: all .25s cubic-bezier(.16,1,.3,1);
}
.outro-cell::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--lcs), transparent);
  opacity: 0.7;
}
.outro-cell:hover {
  border-color: var(--lc);
  transform: translateY(-3px);
  box-shadow: 0 12px 32px var(--lcg);
}
.outro-cell .num {
  font-family: var(--display);
  font-size: 26px; font-weight: 800;
  color: var(--lc);
  position: relative; z-index: 1;
  letter-spacing: -0.02em;
}
.outro-cell .lbl {
  font-family: var(--mono); font-size: 8px;
  color: var(--t4);
  text-transform: uppercase; letter-spacing: .15em;
  margin-top: 4px;
  position: relative; z-index: 1;
}
.outro-cta {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 14px 28px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  color: var(--t1);
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .25em;
  border-radius: 99px;
  cursor: pointer;
  transition: all .2s;
  animation: rise .7s .4s both;
}
.outro-cta:hover {
  background: rgba(255,255,255,0.08);
  border-color: var(--line-h);
  transform: translateY(-2px);
}

</style>
</head>

    <div class="boot-ring r1"></div>
    <div class="boot-ring r2"></div>

  </div>

  <main><div id="stage"></div></main>

    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="btn-next">Next →</button>
  </footer>
</div>

/* ==========================================================
   IMAGE PROCESSING ALGORITHMS — vanilla JS
   ========================================================== */

const IMG_SIZE = 200;

// Convert RGBA to grayscale
function rgbaToGrayscale(rgba, w, h) {
  const out = new Uint8ClampedArray(w * h);
  for (let i = 0; i < w * h; i++) {
    const r = rgba[i * 4], g = rgba[i * 4 + 1], b = rgba[i * 4 + 2];
    out[i] = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
  }
  return out;
}

// Render grayscale to canvas
function renderToCanvas(canvas, gray, w, h) {
  if (!canvas) return;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  const imgData = ctx.createImageData(w, h);
  for (let i = 0; i < w * h; i++) {
    imgData.data[i * 4] = gray[i];
    imgData.data[i * 4 + 1] = gray[i];
    imgData.data[i * 4 + 2] = gray[i];
    imgData.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(imgData, 0, 0);
}

// Render float array (auto-stretch)
function renderFloatToCanvas(canvas, arr, w, h) {
  if (!canvas) return;
  let mn = Infinity, mx = -Infinity;
  for (const v of arr) { if (v < mn) mn = v; if (v > mx) mx = v; }
  const r = mx - mn || 1;
  const out = new Uint8ClampedArray(arr.length);
  for (let i = 0; i < arr.length; i++) out[i] = Math.round(((arr[i] - mn) / r) * 255);
  renderToCanvas(canvas, out, w, h);
}

function histogram(gray) {
  const h = new Array(256).fill(0);
  for (let i = 0; i < gray.length; i++) h[gray[i]]++;
  return h;
}

function meanStd(gray) {
  let sum = 0;
  for (let i = 0; i < gray.length; i++) sum += gray[i];
  const mean = sum / gray.length;
  let sq = 0;
  for (let i = 0; i < gray.length; i++) { const d = gray[i] - mean; sq += d * d; }
  return { mean, std: Math.sqrt(sq / gray.length) };
}

// Draw histogram to canvas
function drawHistogram(canvas, data, color) {
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth || canvas.parentElement.clientWidth - 6;
  const H = canvas.clientHeight || canvas.parentElement.clientHeight - 6;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  const max = Math.max(...data) || 1;
  const bw = W / 256;
  for (let i = 0; i < 256; i++) {
    const bh = (data[i] / max) * (H - 2);
    const a = 0.6 + (data[i] / max) * 0.4;
    ctx.fillStyle = color;
    ctx.globalAlpha = a;
    ctx.fillRect(i * bw, H - bh - 1, Math.max(bw, 1), bh);
  }
  ctx.globalAlpha = 1;
}

/* === LAB 1: GHE & LHE === */
function ghe(gray) {
  const N = gray.length, h = histogram(gray), cdf = new Array(256);
  cdf[0] = h[0];
  for (let i = 1; i < 256; i++) cdf[i] = cdf[i - 1] + h[i];
  const map = cdf.map(c => Math.round(255 * c / N));
  const out = new Uint8ClampedArray(N);
  for (let i = 0; i < N; i++) out[i] = map[gray[i]];
  return out;
}

function lhe(gray, w, h, tilesX, tilesY) {
  const out = new Uint8ClampedArray(w * h);
  const tw = Math.floor(w / tilesX), th = Math.floor(h / tilesY);
  for (let ty = 0; ty < tilesY; ty++) {
    for (let tx = 0; tx < tilesX; tx++) {
      const x0 = tx * tw, y0 = ty * th;
      const x1 = (tx === tilesX - 1) ? w : x0 + tw;
      const y1 = (ty === tilesY - 1) ? h : y0 + th;
      const tile = [];
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) tile.push(gray[y * w + x]);
      const hist = new Array(256).fill(0);
      for (const v of tile) hist[v]++;
      const cdf = new Array(256); cdf[0] = hist[0];
      for (let i = 1; i < 256; i++) cdf[i] = cdf[i - 1] + hist[i];
      const N = tile.length;
      const map = cdf.map(c => Math.round(255 * c / N));
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) out[y * w + x] = map[gray[y * w + x]];
    }
  }
  return out;
}

/* === LAB 2: Bi-HE === */
function bihe(gray) {
  const N = gray.length, mean = meanStd(gray).mean, m = Math.round(mean);
  const hist = histogram(gray);
  const lower = hist.slice(0, m + 1), upper = hist.slice(m + 1);
  const sumL = lower.reduce((a, b) => a + b, 0) || 1;
  const sumU = upper.reduce((a, b) => a + b, 0) || 1;
  const cdfL = []; let cl = 0;
  for (const v of lower) { cl += v; cdfL.push(cl / sumL); }
  const cdfU = []; let cu = 0;
  for (const v of upper) { cu += v; cdfU.push(cu / sumU); }
  const map = new Array(256);
  for (let i = 0; i <= m; i++) map[i] = Math.round(m * cdfL[i]);
  for (let i = m + 1; i < 256; i++) map[i] = Math.round((255 - (m + 1)) * cdfU[i - m - 1] + (m + 1));
  const out = new Uint8ClampedArray(N);
  for (let i = 0; i < N; i++) out[i] = map[gray[i]];
  return { out, m };
}

/* === LAB 3: DCT + SVD === */
function dct1D(x) {
  const N = x.length, X = new Array(N).fill(0);
  for (let k = 0; k < N; k++) {
    let s = 0;
    for (let n = 0; n < N; n++) s += x[n] * Math.cos(Math.PI * (2 * n + 1) * k / (2 * N));
    const c = (k === 0) ? Math.sqrt(1 / N) : Math.sqrt(2 / N);
    X[k] = c * s;
  }
  return X;
}
function idct1D(X) {
  const N = X.length, x = new Array(N).fill(0);
  for (let n = 0; n < N; n++) {
    let s = 0;
    for (let k = 0; k < N; k++) {
      const c = (k === 0) ? Math.sqrt(1 / N) : Math.sqrt(2 / N);
      s += c * X[k] * Math.cos(Math.PI * (2 * n + 1) * k / (2 * N));
    }
    x[n] = s;
  }
  return x;
}
function dct2D(M, w, h) {
  const tmp = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    const row = []; for (let x = 0; x < w; x++) row.push(M[y * w + x]);
    const R = dct1D(row);
    for (let x = 0; x < w; x++) tmp[y * w + x] = R[x];
  }
  const out = new Float32Array(w * h);
  for (let x = 0; x < w; x++) {
    const col = []; for (let y = 0; y < h; y++) col.push(tmp[y * w + x]);
    const C = dct1D(col);
    for (let y = 0; y < h; y++) out[y * w + x] = C[y];
  }
  return out;
}
function idct2D(M, w, h) {
  const tmp = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    const row = []; for (let x = 0; x < w; x++) row.push(M[y * w + x]);
    const R = idct1D(row);
    for (let x = 0; x < w; x++) tmp[y * w + x] = R[x];
  }

/* Count 8-connected components in a Uint8ClampedArray binary image (BFS) */
function countConnectedComponents(binary, w, h) {
  const visited = new Uint8Array(w * h);
  let count = 0;
  for (let start = 0; start < binary.length; start++) {
    if (binary[start] === 0 || visited[start]) continue;
    count++;
    const stack = [start];
    visited[start] = 1;
    while (stack.length > 0) {
      const idx = stack.pop();
      const row = Math.floor(idx / w), col = idx % w;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = row + dr, nc = col + dc;
          if (nr < 0 || nr >= h || nc < 0 || nc >= w) continue;
          const ni = nr * w + nc;
          if (binary[ni] > 0 && !visited[ni]) { visited[ni] = 1; stack.push(ni); }
        }
      }
    }
  }
  return count;
}

  const kwRe = new RegExp('\\b(' + KW.join('|') + ')\\b', 'g');

    let line = escape(raw);
    line = line.replace(/(%.*$)/g, '<span class="tk-cmt">$1</span>');
    line = line.replace(kwRe, '<span class="tk-kw">$1</span>');

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
      else e.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(c));
    else if (Array.isArray(c)) c.forEach(x => x && e.appendChild(x));

}

    "main": "img = imread('lena.gif');\nimg = uint8(img);\n\n[rows, cols] = size(img);\n\n% bi-histogram equalization\nmean_intensity = round(mean2(img));\nhistogram = imhist(img);\n\nlower_hist = histogram(1:mean_intensity+1);\nupper_hist = histogram(mean_intensity+2:end);\n\ncdf_lower = cumsum(lower_hist) / sum(lower_hist);\ncdf_upper = cumsum(upper_hist) / sum(upper_hist);\n\nmap = zeros(256,1);\n\nmap(1:mean_intensity+1) = round(mean_intensity * cdf_lower);\nmap(mean_intensity+2:256) = round((255 - (mean_intensity+1)) * cdf_upper + (mean_intensity+1));\n\nbi_equalized_image = uint8(map(img + 1));\n\nfigure;\n\nsubplot(2,2,1)\nimshow(img)\ntitle('Original Image')\n\nsubplot(2,2,2)\nimhist(img)\ntitle('Original Histogram')\n\nsubplot(2,2,3)\nimshow(bi_equalized_image)\ntitle('Bi-Histogram Equalized Image')\n\nsubplot(2,2,4)\nimhist(bi_equalized_image)\ntitle('Bi-Histogram Histogram')\n\nfprintf('Original Mean: %.2f\\n', mean2(img));\nfprintf('Bi-HE Mean: %.2f\\n', mean2(bi_equalized_image));\nfprintf('Original Std: %.2f\\n', std2(img));\nfprintf('Bi-HE Std: %.2f\\n', std2(bi_equalized_image));"
  },
  "3": {
    "main": "clc;\nclear;\nclose all;\n\n% STEP 1: Load Image and Convert to Grayscale\n\nimg_color = imread('Satellite.jpg');\n\nif size(img_color,3) == 3\n    img = rgb2gray(img_color);\nelse\n    img = img_color;\nend\n\nimg = im2double(img);     % convert to [0,1]\n[M,N] = size(img);\n\nfprintf('Image size: %d x %d\\n',M,N);\n\n% STEP 2: Global Histogram Equalization (Reference Image)\n\nimg_uint8 = im2uint8(img);\nimg_ghe   = histeq(img_uint8);\nimg_ghe   = im2double(img_ghe);\n\n% STEP 3: Apply 2D DCT\n\ndct_img     = dct2(img);\ndct_img_ghe = dct2(img_ghe);\n\n% STEP 4: Divide DCT into 4 Quadrants (LAB REQUIREMENT)\n% B1 = Low frequency (illumination)\n\nhM = floor(M/2);\nhN = floor(N/2);\n\n% Original image quadrants\nB1 = dct_img(1:hM , 1:hN);\nB2 = dct_img(1:hM , hN+1:N);\nB3 = dct_img(hM+1:M , 1:hN);\nB4 = dct_img(hM+1:M , hN+1:N);\n\n% GHE image low-frequency block\nB1_ghe = dct_img_ghe(1:hM , 1:hN);\n\n% STEP 5: Apply SVD ONLY on B1 (Low Frequency Block)\n\n[U_I, S_I, V_I] = svd(B1);\n[U_GHE, S_GHE, V_GHE] = svd(B1_ghe);\n\n\n% STEP 6: Correction Coefficient (xi)\n% xi = max(S_GHE) / max(S_I)\n\nxi = max(diag(S_GHE)) / max(diag(S_I));\nfprintf('Correction coefficient (xi) = %.4f\\n', xi);\n\n\n% STEP 7: Compute Alpha and New Sigma\n% alpha = 1/4 * (xi + 1/xi)\n% New Sigma = alpha*(xi*S_I + (1/xi)*S_GHE)\n\nalpha = (1/4)*(xi + 1/xi);\n\nS_new = alpha * ( xi*S_I + (1/xi)*S_GHE );\n\n\n% STEP 8: Reconstruct Enhanced Low-Frequency Block\n\nB1_new = U_I * S_new * V_I';\n\n% STEP 9: Rebuild Full DCT Matrix\n\ndct_enhanced = [B1_new  B2;\n                B3      B4];\n\n% STEP 10: Apply Inverse DCT\nimg_enhanced = idct2(dct_enhanced);\n\n% clip values\nimg_enhanced = max(0,min(1,img_enhanced));\n\nimg_enhanced_uint8 = im2uint8(img_enhanced);\n\n% STEP 11: Calculate Statistics\norig_mean = mean2(img_uint8);\norig_std  = std2(double(img_uint8));\n\nenh_mean  = mean2(img_enhanced_uint8);\nenh_std   = std2(double(img_enhanced_uint8));\n\nAMBE = abs(enh_mean - orig_mean);\n\nfprintf('\\n--- Image Statistics ---\\n');\nfprintf('Original  -> Mean: %.2f , Std: %.2f\\n',orig_mean,orig_std);\nfprintf('Enhanced  -> Mean: %.2f , Std: %.2f\\n',enh_mean,enh_std);\nfprintf('AMBE = %.4f\\n',AMBE);\n\n% STEP 12: Display Results\n\nfigure('Name','Lab 3 - DCT SVD Enhancement',...\n       'Position',[100 100 1400 900]);\n\n% ---------------- Images ----------------\nsubplot(2,4,1)\nimshow(img_uint8)\ntitle(sprintf('Original\\nMean=%.1f Std=%.1f',orig_mean,orig_std));\n\nsubplot(2,4,2)\nimshow(im2uint8(img_ghe))\nghe_mean = mean2(im2uint8(img_ghe));\nghe_std  = std2(double(im2uint8(img_ghe)));\ntitle(sprintf('GHE\\nMean=%.1f Std=%.1f',ghe_mean,ghe_std));\n\nsubplot(2,4,3)\nimshow(img_enhanced_uint8)\ntitle(sprintf('DCT-SVD Enhanced\\nMean=%.1f Std=%.1f',enh_mean,enh_std));\n\n% Difference Image\ndiff_img = abs(double(img_enhanced_uint8)-double(img_uint8));\nsubplot(2,4,4)\nimshow(uint8(diff_img*3))\ntitle('Difference Image (x3)');\n\n% ---------------- Histograms ----------------\nsubplot(2,4,5)\nimhist(img_uint8,256)\ntitle('Histogram - Original')\n\nsubplot(2,4,6)\nimhist(im2uint8(img_ghe),256)\ntitle('Histogram - GHE')\n\nsubplot(2,4,7)\nimhist(img_enhanced_uint8,256)\ntitle('Histogram - DCT-SVD')\n\n% Std comparison\nsubplot(2,4,8)\nbar([orig_std,ghe_std,enh_std],0.5)\nset(gca,'XTickLabel',{'Original','GHE','DCT-SVD'})\nylabel('Standard Deviation')\ntitle(sprintf('Std Comparison (AMBE=%.2f)',AMBE))\ngrid on\n\nsgtitle('Lab 3: Image Enhancement Using DCT and SVD',...\n        'FontSize',14,'FontWeight','bold');\n\n"
  },
  "4": {
    "main": "%% ============================================================\n%  Noise Removal Lab \n%  Image Processing Lab: Noise Addition & Filtering\n%% ============================================================\n\nclear; clc; close all;\n\n%% ── Load the original image ──────────────────────────────\nimg = imread('lena.gif');\nif size(img, 3) == 3\n    img = rgb2gray(img);   % ensure grayscale\nend\nimg = im2double(img);      % convert to [0,1] range\n\nfprintf('=== Original Image Stats ===\\n');\nfprintf('Mean: %.4f\\nStd Dev: %.4f\\n\\n', mean2(img), std2(img));\n\n%% ── Add Gaussian Noise ─────────────────────────────────\ngauss_noisy = imnoise(img, 'gaussian', 0, 0.01);   % mean=0, var=0.01\n\nfprintf('=== Gaussian Noisy Image Stats ===\\n');\nfprintf('Mean: %.4f\\nStd Dev: %.4f\\n\\n', mean2(gauss_noisy), std2(gauss_noisy));\n\n%% ── Add Salt & Pepper Noise ───────────────────────────\nsp_noisy = imnoise(img, 'salt & pepper', 0.05);    % density=0.05\n\nfprintf('=== Salt & Pepper Noisy Image Stats ===\\n');\nfprintf('Mean: %.4f\\nStd Dev: %.4f\\n\\n', mean2(sp_noisy), std2(sp_noisy));\n\n%% ── Apply Average and Median Filters (3×3) ───────────────\n\n% --- Average filter kernels (manual definition – no fspecial needed) ---\navg3 = ones(3,3) / 9;    % 3x3 averaging kernel\navg5 = ones(5,5) / 25;   % 5x5 averaging kernel\navg7 = ones(7,7) / 49;   % 7x7 averaging kernel\n\n% --- Apply Average filter using filter2  ---\ngauss_avg3 = filter2(avg3, gauss_noisy);\ngauss_avg5 = filter2(avg5, gauss_noisy);\ngauss_avg7 = filter2(avg7, gauss_noisy);\n\nsp_avg3    = filter2(avg3, sp_noisy);\nsp_avg5    = filter2(avg5, sp_noisy);\nsp_avg7    = filter2(avg7, sp_noisy);\n\n% Clip to valid range after filtering\ngauss_avg3 = min(max(gauss_avg3, 0), 1);\ngauss_avg5 = min(max(gauss_avg5, 0), 1);\ngauss_avg7 = min(max(gauss_avg7, 0), 1);\nsp_avg3    = min(max(sp_avg3,    0), 1);\nsp_avg5    = min(max(sp_avg5,    0), 1);\nsp_avg7    = min(max(sp_avg7,    0), 1);\n\n% --- Apply Median filter ---\ngauss_med3 = medfilt2(gauss_noisy, [3 3]);\ngauss_med5 = medfilt2(gauss_noisy, [5 5]);\ngauss_med7 = medfilt2(gauss_noisy, [7 7]);\n\nsp_med3    = medfilt2(sp_noisy,    [3 3]);\nsp_med5    = medfilt2(sp_noisy,    [5 5]);\nsp_med7    = medfilt2(sp_noisy,    [7 7]);\n\n%% ── Display: Original & Noisy Images ─────────────────────\nfigure('Name', 'Original and Noisy Images', 'Position', [50 50 1200 700]);\n\nsubplot(2,3,1); imshow(img);            title('Original');\nsubplot(2,3,2); imshow(gauss_noisy);    title('Gaussian Noise (var=0.02)');\nsubplot(2,3,3); imshow(sp_noisy);       title('Salt & Pepper (d=0.05)');\n\nsubplot(2,3,4); imhist(im2uint8(img));\ntitle(sprintf('Hist - Mean=%.2f  Std=%.2f', mean2(img)*255, std2(img)*255));\n\nsubplot(2,3,5); imhist(im2uint8(gauss_noisy));\ntitle(sprintf('Hist - Mean=%.2f  Std=%.2f', mean2(gauss_noisy)*255, std2(gauss_noisy)*255));\n\nsubplot(2,3,6); imhist(im2uint8(sp_noisy));\ntitle(sprintf('Hist - Mean=%.2f  Std=%.2f', mean2(sp_noisy)*255, std2(sp_noisy)*255));\n\n%% ── Display: Gaussian Noise – 3×3 Filters ────────────────\nfigure('Name', 'Gaussian Noise - 3x3 Filters', 'Position', [50 50 1200 700]);\n\nsubplot(2,3,1); imshow(gauss_noisy);  title('Gaussian Noisy');\nsubplot(2,3,2); imshow(gauss_avg3);   title('Average Filter 3x3');\nsubplot(2,3,3); imshow(gauss_med3);   title('Median Filter 3x3');\n\nsubplot(2,3,4); imhist(im2uint8(gauss_noisy));\ntitle(sprintf('Mean=%.2f  Std=%.2f', mean2(gauss_noisy)*255, std2(gauss_noisy)*255));\n\nsubplot(2,3,5); imhist(im2uint8(gauss_avg3));\ntitle(sprintf('Mean=%.2f  Std=%.2f', mean2(gauss_avg3)*255, std2(gauss_avg3)*255));\n\nsubplot(2,3,6); imhist(im2uint8(gauss_med3));\ntitle(sprintf('Mean=%.2f  Std=%.2f', mean2(gauss_med3)*255, std2(gauss_med3)*255));\n\n%% ── Display: Salt & Pepper – 3×3 Filters ─────────────────\nfigure('Name', 'Salt and Pepper - 3x3 Filters', 'Position', [50 50 1200 700]);\n\nsubplot(2,3,1); imshow(sp_noisy);  title('S&P Noisy');\nsubplot(2,3,2); imshow(sp_avg3);   title('Average Filter 3x3');\nsubplot(2,3,3); imshow(sp_med3);   title('Median Filter 3x3');\n\nsubplot(2,3,4); imhist(im2uint8(sp_noisy));\ntitle(sprintf('Mean=%.2f  Std=%.2f', mean2(sp_noisy)*255, std2(sp_noisy)*255));\n\nsubplot(2,3,5); imhist(im2uint8(sp_avg3));\ntitle(sprintf('Mean=%.2f  Std=%.2f', mean2(sp_avg3)*255, std2(sp_avg3)*255));\n\nsubplot(2,3,6); imhist(im2uint8(sp_med3));\ntitle(sprintf('Mean=%.2f  Std=%.2f', mean2(sp_med3)*255, std2(sp_med3)*255));\n\n%% ── 7. Display: Mask Size Comparison ────────────────────────\nfigure('Name', 'Mask Size Comparison', 'Position', [50 50 1400 900]);\n\nimgs_grid  = {gauss_avg3, gauss_avg5, gauss_avg7; ...\n              gauss_med3, gauss_med5, gauss_med7; ...\n              sp_med3,    sp_med5,    sp_med7};\nrow_labels = {'Gaussian - Average', 'Gaussian - Median', 'S&P - Median'};\nmask_sizes = {'3x3', '5x5', '7x7'};\n\nfor r = 1:3\n    for c = 1:3\n        subplot(3, 3, (r-1)*3 + c);\n        imshow(imgs_grid{r, c});\n        title(sprintf('%s\\n%s | Std=%.2f', row_labels{r}, mask_sizes{c}, ...\n              std2(imgs_grid{r,c})*255));\n    end\nend\n\n%% ── Print Final Statistics ────────────────────────────────\nfprintf('\\n=== Filter Results (3x3) ===\\n');\nfprintf('%-25s %-10s %-10s\\n', 'Image', 'Mean', 'Std Dev');\nfprintf('%s\\n', repmat('-', 1, 47));\n\nall_imgs   = {gauss_noisy, gauss_avg3, gauss_med3, sp_noisy, sp_avg3, sp_med3};\nall_labels = {'Gauss Noisy', 'Gauss Avg 3x3', 'Gauss Med 3x3', ...\n              'S&P Noisy',   'S&P Avg 3x3',   'S&P Med 3x3'};\n\nfor i = 1:length(all_imgs)\n    im = all_imgs{i};\n    fprintf('%-25s %-10.2f %-10.2f\\n', all_labels{i}, mean2(im)*255, std2(im)*255);\nend\n\nfprintf('\\nDone! All figures displayed.\\n');\n"
  },
  "5": {
    "main": "% =========================================================================\n% Image Processing Lab: Laplacian Filter, Commutativity & Edge Counting\n% =========================================================================\n\n% 1. Read and Prepare the Image\nfilename = 'cameraman.tif'; % You can change this to 'lena.gif'\nI_orig = imread(filename);\n\n% Convert to grayscale if it is an RGB image\nif size(I_orig, 3) == 3\n    I_gray = rgb2gray(I_orig);\nelse\n    I_gray = I_orig;\nend\n\n% Convert to double to prevent clipping to 0 during filtering\nI = im2double(I_gray);\n\n% =========================================================================\n% PART A: Apply Laplacian Filter\n% =========================================================================\n\n% Choose your mask type here: set to 4 or 8\nmask_type = 8; \n\nif mask_type == 4\n    % Standard 3x3 Laplacian mask (center -4)\n    lap_mask = [ 0  1  0; \n                 1 -4  1; \n                 0  1  0];\nelseif mask_type == 8\n    % Diagonal 3x3 Laplacian mask (center -8)\n    lap_mask = [ 1  1  1; \n                 1 -8  1; \n                 1  1  1];\nelse\n    error('Please select mask_type = 4 or 8');\nend\n\n% Apply the Laplacian mask\nI_laplacian = imfilter(I, lap_mask, 'replicate');\n\n% Calculate Statistics\nmean_orig = mean(I(:));\nstd_orig = std(I(:));\nmean_lap = mean(I_laplacian(:));\nstd_lap = std(I_laplacian(:));\n\n% --- Plotting Results for Part A ---\nfigure('Name', 'Part A: Original vs Laplacian', 'NumberTitle', 'off', 'Position', [100, 100, 900, 600]);\n\nsubplot(2, 2, 1);\nimshow(I);\ntitle(sprintf('Original Image\\nMean: %.4f | Std Dev: %.4f', mean_orig, std_orig));\n\nsubplot(2, 2, 2);\nimhist(I);\ntitle('Histogram of Original Image');\n\nsubplot(2, 2, 3);\nimshow(I_laplacian, []);\ntitle(sprintf('Laplacian Filtered (Mask -%d)\\nMean: %.4f | Std Dev: %.4f', mask_type, mean_lap, std_lap));\n\nsubplot(2, 2, 4);\nhistogram(I_laplacian(:), 256, 'EdgeColor', 'none', 'FaceColor', 'c');\ntitle('Histogram of Laplacian Image');\n\n\n% =========================================================================\n% PART B: Commutativity (Average -> Laplacian vs. Laplacian -> Average)\n% =========================================================================\n\n% Define a 3x3 Averaging Mask\navg_mask = fspecial('average', [3 3]);\n\n% Method 1: Average First, then Laplacian\nI_avg_first = imfilter(I, avg_mask, 'replicate');\nResult_1 = imfilter(I_avg_first, lap_mask, 'replicate');\n\n% Method 2: Laplacian First, then Average\nI_lap_first = imfilter(I, lap_mask, 'replicate');\nResult_2 = imfilter(I_lap_first, avg_mask, 'replicate');\n\ndifference = abs(Result_1 - Result_2);\nmax_diff = max(difference(:));\n\ndisp('--- Part B: Commutativity Test ---');\ndisp(['Maximum pixel difference between (Avg -> Lap) and (Lap -> Avg): ', num2str(max_diff)]);\n\n\n% =========================================================================\n% PART C: Counting Edges\n% =========================================================================\ndisp('--- Part C: Edge Counting ---');\n\n% 1. Create a binary edge map by thresholding the absolute Laplacian\n% We take the absolute value because edges have both positive and negative spikes\nabs_laplacian = abs(I_laplacian);\n\n% Define a threshold. You may need to tune this depending on the image!\n% A common automated way is using a fraction of the maximum gradient.\nthreshold = 0.05 * max(abs_laplacian(:)); \nI_edges_binary = abs_laplacian > threshold;\n\n% 2. Count Total Edge Pixels\nnum_edge_pixels = nnz(I_edges_binary); % nnz counts non-zero elements\n\n% 3. Count Connected Edge Segments (distinct edge lines/objects)\n% bwconncomp finds connected components in a binary image. We use 8-connectivity.\nconnected_edges = bwconncomp(I_edges_binary, 8);\nnum_edge_segments = connected_edges.NumObjects;\n\ndisp(['Total number of edge pixels: ', num2str(num_edge_pixels)]);\ndisp(['Total number of distinct edge segments: ', num2str(num_edge_segments)]);\n\n% --- Plotting Results for Edge Counting ---\nfigure('Name', 'Part C: Edge Counting', 'NumberTitle', 'off', 'Position', [200, 200, 800, 400]);\n\nsubplot(1, 2, 1);\nimshow(abs_laplacian, []);\ntitle('Absolute Laplacian Magnitude');\n\nsubplot(1, 2, 2);\nimshow(I_edges_binary);\ntitle(sprintf('Binary Edges (Threshold: %.3f)\\nPixels: %d | Segments: %d', threshold, num_edge_pixels, num_edge_segments));"
  },
  "6": {
    "main": "clear; close all; clc;\n\nI = imread('Lena/lena.jpg');\nif size(I, 3) == 3\n    I = rgb2gray(I);\n    disp('Converted RGB to grayscale.');\nend\n\n% Manual implementations\nsobel_edges  = my_sobel_edge(I);\ncanny_edges  = my_canny(I);   % sigma, low, high\n\n[Gmag, ~, Gx, Gy] = my_sobel_raw(I);\n\n% Visualization (same as original)\nfigure('Name', 'Lena Edge Detection - Images', 'Position', [100 100 1400 900]);\n\nsubplot(2, 3, 1); imshow(I); title('Original Grayscale Lena');\nsubplot(2, 3, 2); imshow(sobel_edges); title('Manual Sobel Edges');\nsubplot(2, 3, 3); imshow(canny_edges); title('Manual Canny Edges');\nsubplot(2, 3, 4); imshow(Gmag, []); title('Sobel Gradient Magnitude'); colormap gray;\nsubplot(2, 3, 5); imshow(Gx, []); title('Gx (Horizontal)');\nsubplot(2, 3, 6); imshow(Gy, []); title('Gy (Vertical)');\n\n% Histograms and statistics (unchanged logic)\nfigure('Name', 'Lena Edge Detection - Histograms', 'Position', [100 100 1200 400]);\nsubplot(1,3,1); imhist(I); title('Original');\nsubplot(1,3,2); imhist(sobel_edges); title('Manual Sobel');\nsubplot(1,3,3); imhist(canny_edges); title('Manual Canny');\n\n% Statistics\nfprintf('\\n=== STATISTICS ===\\n');\nfprintf('Original : Mean=%.2f  Std=%.2f\\n', mean(I(:)), std(double(I(:))));\nfprintf('Sobel    : Edge fraction=%.4f\\n', mean(sobel_edges(:)));\nfprintf('Canny    : Edge fraction=%.4f\\n', mean(canny_edges(:)));\nfprintf('Gmag     : Mean=%.2f  Std=%.2f\\n', mean(Gmag(:)), std(Gmag(:)));\n\n\nfunction [Gmag, Gdir, Gx, Gy] = my_sobel_raw(I)\nif ~isfloat(I)\n    I = double(I);\nend\n\nGx_kernel = [-1 0 1; -2 0 2; -1 0 1];\nGy_kernel = [-1 -2 -1; 0 0 0; 1 2 1];\n\nGx = conv2(I, Gx_kernel, 'same');\nGy = conv2(I, Gy_kernel, 'same');\n\nGmag = sqrt(Gx.^2 + Gy.^2);\nGdir = atan2(Gy, Gx) * (180/pi);\nend\n\n\nfunction edges = my_sobel_edge(I, threshold)\n    [Gmag, ~] = my_sobel_raw(I);\n    \n    if nargin < 2 || isempty(threshold)\n        threshold = 0.18 * max(Gmag(:));   % relative to this image\n    elseif threshold < 1\n        threshold = threshold * max(Gmag(:));  % if user passes 0.1 etc.\n    end\n    \n    edges = Gmag > threshold;\nend\n\n\nfunction suppressed = non_max_suppression(Gmag, Gdir)\n    [rows, cols] = size(Gmag);\n    suppressed = zeros(rows, cols);\n    \n    % Quantize directions to 0°, 45°, 90°, 135°\n    dir_quant = round(Gdir / 45) * 45;\n    dir_quant = mod(dir_quant, 180);\n    \n    for i = 2:rows-1\n        for j = 2:cols-1\n            mag = Gmag(i,j);\n            d = dir_quant(i,j);\n    \n            if d == 0 || d == 180\n                neigh1 = Gmag(i, j+1);\n                neigh2 = Gmag(i, j-1);\n            elseif d == 45\n                neigh1 = Gmag(i-1, j+1);\n                neigh2 = Gmag(i+1, j-1);\n            elseif d == 90\n                neigh1 = Gmag(i-1, j);\n                neigh2 = Gmag(i+1, j);\n            elseif d == 135\n                neigh1 = Gmag(i-1, j-1);\n                neigh2 = Gmag(i+1, j+1);\n            else\n                neigh1 = 0; neigh2 = 0;\n            end\n    \n            if mag >= neigh1 && mag >= neigh2\n                suppressed(i,j) = mag;\n            end\n        end\n    end\nend\n\n\nfunction edges = hysteresis_thresholding(img, low, high)\n    [rows, cols] = size(img);\n    edges = zeros(rows, cols);\n    \n    strong = img >= high;\n    weak   = (img >= low) & (img < high);\n    \n    edges(strong) = 1;\n    \n    % Connect weak edges to strong ones (8-connectivity)\n    [y, x] = find(strong);\n    for k = 1:length(y)\n        i = y(k); j = x(k);\n        for di = -1:1\n            for dj = -1:1\n                ni = i + di; nj = j + dj;\n                if ni>=1 && ni<=rows && nj>=1 && nj<=cols\n                    if weak(ni,nj)\n                        edges(ni,nj) = 1;\n                        weak(ni,nj) = false;  % avoid re-processing\n                    end\n                end\n            end\n        end\n    end\nend\n\n\nfunction edges = my_canny(I, sigma, low_ratio, high_ratio)\n    if nargin < 2, sigma = 0.5; end\n    if nargin < 3, low_ratio = 0.15; end\n    if nargin < 4, high_ratio = 0.25; end\n    \n    I = im2double(I);\n    \n    % Gaussian smoothing\n    h = fspecial('gaussian', 2*ceil(3*sigma)+1, sigma);\n    smoothed = conv2(I, h, 'same');\n    \n    % Raw gradient\n    [Gmag, Gdir] = my_sobel_raw(smoothed);\n    \n    % Non-maximum suppression\n    suppressed = non_max_suppression(Gmag, Gdir);\n    \n    % Adaptive hysteresis thresholds\n    max_mag = max(suppressed(:));\n    high = high_ratio * max_mag;\n    low  = low_ratio * high;\n    \n    edges = hysteresis_thresholding(suppressed, low, high);\nend\n\n"
  },
  "7": {
    "main": "clc; clear; close all;\nI = imread('lena.gif');\nif size(I,3) == 3\n    I = rgb2gray(I);\nend\nI = double(I);\n\n% Preprocessing\nmu = mean(I(:));\nsigma = std(I(:));\nI_norm = (I - mu) / sigma;\n\n% Prewitt Gradient\nGx_kernel = [-1 0 1; -1 0 1; -1 0 1];\nGy_kernel = [-1 -1 -1; 0 0 0; 1 1 1];\nDH = conv2(I_norm, Gx_kernel, 'same');\nDV = conv2(I_norm, Gy_kernel, 'same');\nG = sqrt(DH.^2 + DV.^2);\n\n% Adaptive outlier removal\nabs_grad = abs([DH(:); DV(:)]);\n% disp(abs_grad)\n% Measure how skewed the gradient distribution is\ng_mean = mean(abs_grad);\ng_median = median(abs_grad);\ng_std = std(abs_grad);\n\n% Skewness ratio: how far mean is pulled above median by outliers\n% If mean >> median, there are heavy outliers pulling it up\nskew_ratio = (g_mean - g_median) / g_std;\n\n% Adaptively choose percentile based on skewness\nif skew_ratio < 0.1\n    % almost no outliers (safe to use high percentile)\n    pct = 99;\nelseif skew_ratio < 0.3\n    % few outliers\n    pct = 97;\nelseif skew_ratio < 0.6\n    % some outliers\n    pct = 95;\nelse\n    % many outliers (be more aggressive)\n    pct = 90;\nend\n\nrange = prctile(abs_grad, pct);\nrange = max(range, 1);\nrange\n% Type-1 Fuzzy\nfis = newfis('EdgeDetection','mamdani');\n\nDH = max(min(DH,  range), -range);\nDV = max(min(DV,  range), -range);\nfis = addvar(fis,'input','DH',[-range range]);\nfis = addvar(fis,'input','DV',[-range range]);\n\nfis = addmf(fis,'input',1,'LOW','gaussmf',[range/3 -range/2]);\nfis = addmf(fis,'input',1,'MEDIUM','gaussmf',[range/3 0]);\nfis = addmf(fis,'input',1,'HIGH','gaussmf',[range/3 range/2]);\nfis = addmf(fis,'input',2,'LOW','gaussmf',[range/3 -range/2]);\nfis = addmf(fis,'input',2,'MEDIUM','gaussmf',[range/3 0]);\nfis = addmf(fis,'input',2,'HIGH','gaussmf',[range/3 range/2]);\n\nfis = addvar(fis,'output','EDGES',[0 255]);\nfis = addmf(fis,'output',1,'LOW','gaussmf',[30 30]);\nfis = addmf(fis,'output',1,'MEDIUM','gaussmf',[30 128]);\nfis = addmf(fis,'output',1,'HIGH','gaussmf',[30 220]);\n\n% Rules\nruleList = [\n    1 1 1 1 1; % Rule 1:  DH=LOW,    DV=LOW,    EDGES=LOW\n    2 2 3 1 1; % Rule 2:  DH=MEDIUM, DV=MEDIUM, EDGES=HIGH\n    3 2 3 1 1; % Rule 3:  DH=HIGH,   DV=MEDIUM, EDGES=HIGH\n    3 2 3 1 1; % Rule 4:  DH=HIGH,   DV=MEDIUM, EDGES=HIGH\n    2 1 2 1 1; % Rule 5:  DH=MEDIUM, DV=LOW,    EDGES=MEDIUM\n    1 1 1 1 1; % Rule 6:  DH=LOW,    DV=LOW,    EDGES=LOW\n    1 3 3 1 1; % Rule 7:  DH=LOW,    DV=HIGH,   EDGES=HIGH\n    1 2 2 1 1; % Rule 8:  DH=LOW,    DV=MEDIUM, EDGES=MEDIUM\n    2 3 3 1 1; % Rule 9:  DH=MEDIUM, DV=HIGH,   EDGES=HIGH\n    3 3 3 1 1; % Rule 10: DH=HIGH,   DV=HIGH,   EDGES=HIGH\n];\nfis = addrule(fis, ruleList);\n\n% Apply Fuzzy\ninput_data = [DH(:) DV(:)];\noutput = evalfis(input_data, fis);\nedges_fuzzy = reshape(output, size(DH));\nedges_display = mat2gray(edges_fuzzy);\n\n% Edge Detection\nT = mean(edges_fuzzy(:)) + 0.5 * std(edges_fuzzy(:));\nedges_binary = edges_fuzzy > T;\nedge_count = sum(edges_binary(:));\n\nmean_original = mean(I(:));\nstd_original = std(I(:));\nmean_edge = mean(edges_fuzzy(:));\nstd_edge = std(edges_fuzzy(:));\n\nfigure;\nsubplot(3,1,1);\nplotmf(fis,'input',1);\ntitle('DH Membership Functions');\n\nsubplot(3,1,2);\nplotmf(fis,'input',2);\ntitle('DV Membership Functions');\n\nsubplot(3,1,3);\nplotmf(fis,'output',1);\ntitle('EDGES Membership Functions');\n\nfigure;\nsubplot(2,3,1);\nimshow(uint8(I));\ntitle('Original');\nsubplot(2,3,2);\nimshow(G,[]);\ntitle('Gradient');\nsubplot(2,3,3);\nimshow(edges_display);\ntitle('Fuzzy Edge');\nsubplot(2,3,4);\nimshow(edges_binary);\ntitle('Binary Edge');\n\nfigure;\nsubplot(2,1,1);\nimhist(uint8(I));\ntitle('Original Histogram');\nsubplot(2,1,2);\nimhist(uint8(mat2gray(edges_fuzzy)*255));\ntitle('Fuzzy Edge Histogram');\n\nfprintf('--- ORIGINAL IMAGE ---\\n');\nfprintf('Mean = %.2f\\n', mean_original);\nfprintf('Std  = %.2f\\n\\n', std_original);\nfprintf('--- FUZZY EDGE IMAGE ---\\n');\nfprintf('Mean = %.2f\\n', mean_edge);\nfprintf('Std  = %.2f\\n', std_edge);\nfprintf('Edge Pixels = %d\\n', edge_count);"
  }
};

/* === SLIDER & TOGGLE BUILDERS === */
function slider({ label, min, max, step, value, fmt, onChange }) {
  const fmtFn = fmt || (v => v.toFixed(2));
  const wrap = el('div', { class: 'ctrl' });
  const top = el('div', { class: 'ctrl-top' });
  top.appendChild(el('span', { class: 'ctrl-l' }, label));
  const valEl = el('span', { class: 'ctrl-v' }, fmtFn(value));
  top.appendChild(valEl);
  wrap.appendChild(top);

  const trk = el('div', { class: 'slider' });
  const fill = el('div', { class: 'slider-fill', style: { width: ((value - min) / (max - min) * 100) + '%' } });
  const thumb = el('div', { class: 'slider-thumb', style: { left: ((value - min) / (max - min) * 100) + '%' } });
  const inp = el('input', { type: 'range', min: String(min), max: String(max), step: String(step), value: String(value) });
  inp.addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    const pct = ((v - min) / (max - min) * 100) + '%';
    fill.style.width = pct;
    thumb.style.left = pct;
    valEl.textContent = fmtFn(v);
    onChange(v);
  });
  trk.appendChild(fill); trk.appendChild(thumb); trk.appendChild(inp);
  wrap.appendChild(trk);
  return wrap;
}

function toggle({ label, value, options, onChange }) {
  const wrap = el('div', { class: 'ctrl' });
  if (label) {
    const top = el('div', { class: 'ctrl-top' });
    top.appendChild(el('span', { class: 'ctrl-l' }, label));
    wrap.appendChild(top);
  }
  const grp = el('div', { class: 'tg' });
  options.forEach(o => {
    const isActive = o.value === value;
    const btn = el('button', { class: 'tg-btn' + (isActive ? ' active' : ''), onclick: () => onChange(o.value) }, o.label);
    grp.appendChild(btn);
  });
  wrap.appendChild(grp);
  return wrap;
}

/* === SMOOTH HISTOGRAM === */
function drawHistogramCurve(canvas, data, color) {
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth || canvas.parentElement.clientWidth - 8;
  const H = canvas.clientHeight || 64;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  const max = Math.max(...data) || 1;
  const bw = W / 256;
  // Smooth area chart
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i < 256; i++) {
    const x = i * bw;
    const y = H - (data[i] / max) * (H - 4);
    if (i === 0) ctx.lineTo(x, y);
    else {
      const prevX = (i - 1) * bw;
      const prevY = H - (data[i - 1] / max) * (H - 4);
      const cpX = (prevX + x) / 2;
      ctx.quadraticCurveTo(cpX, prevY, x, y);
    }
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  // gradient fill
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, color + 'cc');
  grad.addColorStop(1, color + '10');
  ctx.fillStyle = grad;
  ctx.fill();
  // outline stroke
  ctx.beginPath();
  for (let i = 0; i < 256; i++) {
    const x = i * bw;
    const y = H - (data[i] / max) * (H - 4);
    if (i === 0) ctx.moveTo(x, y);
    else {
      const prevX = (i - 1) * bw;
      const prevY = H - (data[i - 1] / max) * (H - 4);
      const cpX = (prevX + x) / 2;
      ctx.quadraticCurveTo(cpX, prevY, x, y);
    }
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

  const out = new Uint8ClampedArray(src.length);
  for (let i = 0; i < src.length; i++) out[i] = Math.max(0, Math.min(255, src[i] + delta));
  return out;
}

function computeLab2() {
  const shifted = state.lab2.preShift !== 0
    ? shiftBrightness(state.source, state.lab2.preShift)
    : state.source;
  const r = bihe(shifted);
  renderToCanvas(document.getElementById('l2-orig'), shifted, state.w, state.h);
  renderToCanvas(document.getElementById('l2-bi'), r.out, state.w, state.h);
  const sO = meanStd(shifted), sB = meanStd(r.out);
  document.getElementById('l2-orig-meta').textContent = 'μ=' + sO.mean.toFixed(1) + '  σ=' + sO.std.toFixed(1);
  document.getElementById('l2-bi-meta').textContent = 'μ=' + sB.mean.toFixed(1) + '  σ=' + sB.std.toFixed(1);
  let sG = null;
  if (state.lab2.showGHE) {
    const gImg = ghe(shifted);
    sG = meanStd(gImg);
    renderToCanvas(document.getElementById('l2-ghe'), gImg, state.w, state.h);
    document.getElementById('l2-ghe-meta').textContent = 'μ=' + sG.mean.toFixed(1) + '  σ=' + sG.std.toFixed(1);
  }
  // Partition histogram
  const cv = document.getElementById('l2-part');
  const wrap = cv.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth - 12, H = wrap.clientHeight - 12;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  const data = histogram(shifted);
  const max = Math.max(...data) || 1;
  const bw = W / 256;
  for (let i = 0; i < 256; i++) {
    const bh = (data[i] / max) * (H - 2);
    ctx.fillStyle = i <= r.m ? '#f43f5e' : '#22d3ee';
    ctx.globalAlpha = 0.7 + (data[i] / max) * 0.3;
    ctx.fillRect(i * bw, H - bh - 1, bw, bh);
  }
  ctx.globalAlpha = 1;
  document.getElementById('l2-mark').style.left = (6 + (r.m / 255) * (W - 6)) + 'px';
  document.getElementById('l2-mark-lbl').textContent = 'μ=' + r.m;
  // Stats
  const sg = document.getElementById('l2-stats');
  sg.innerHTML = '';
  sg.appendChild(statCard('Input μ', sO.mean.toFixed(2)));
  sg.appendChild(statCard('Input σ', sO.std.toFixed(2)));
  if (sG) {
    sg.appendChild(statCard('GHE μ', sG.mean.toFixed(2), { color: 'amber' }));
    sg.appendChild(statCard('GHE σ', sG.std.toFixed(2), { color: 'amber' }));
  }
  sg.appendChild(statCard('Bi-HE μ', sB.mean.toFixed(2), { color: 'accent' }));
  sg.appendChild(statCard('Bi-HE σ', sB.std.toFixed(2), { color: 'accent' }));
  sg.appendChild(statCard('Split μ', r.m, { color: 'cyan', full: true }));
  // AMBE
  const dmu = Math.abs(sB.mean - sO.mean);
  document.getElementById('l2-ambe').textContent = dmu.toFixed(2);
  document.getElementById('l2-ambe-note').textContent = dmu < 5 ? '✓ Brightness preserved' : 'Drift acceptable';
}
